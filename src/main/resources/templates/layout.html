<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}">Hospital Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body {
            display:flex;
            background:#0f2027;
            color:white;
            min-height:100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width:240px;
            background:linear-gradient(180deg,#141e30,#243b55);
            padding:30px 20px;
            position:fixed;
            height:100vh;
        }

        .sidebar h2 {
            text-align:center;
            margin-bottom:40px;
        }

        .sidebar a {
            display:block;
            padding:12px;
            margin-bottom:10px;
            text-decoration:none;
            color:white;
            border-radius:8px;
            transition:0.3s;
        }

        .sidebar a:hover {
            background:rgba(255,255,255,0.15);
        }

        .sidebar a.active {
            background:#4da6ff;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            margin-left:240px;
            flex:1;
            padding:30px;
        }

        .topbar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        /* ===== CARDS ===== */
        .cards {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card {
            background:rgba(255,255,255,0.08);
            padding:20px;
            border-radius:12px;
            backdrop-filter:blur(10px);
            transition:0.3s;
        }

        .card:hover {
            transform:translateY(-5px);
        }

        .card h3 {
            font-weight:400;
        }

        .card .number {
            font-size:30px;
            font-weight:700;
            margin-top:10px;
        }

        /* ===== CHARTS ===== */
        .charts {
            margin-top:40px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .chart-container {
            background:rgba(255,255,255,0.08);
            padding:20px;
            border-radius:12px;
            height:350px;
        }

        canvas {
            width:100% !important;
            height:100% !important;
        }

        /* ===== TABLE ===== */
        table {
            width:100%;
            border-collapse:collapse;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            overflow:hidden;
        }

        th, td {
            padding:12px;
            text-align:left;
        }

        th {
            background:rgba(255,255,255,0.15);
        }

        tr:nth-child(even) {
            background:rgba(255,255,255,0.05);
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px){
            .sidebar{
                display:none;
            }
            .main{
                margin-left:0;
            }
            .charts{
                grid-template-columns:1fr;
            }
        }

    </style>
</head>

<body>

<div class="sidebar">
    <h2>🏥 HMS</h2>
    <a th:href="@{/}" th:classappend="${title=='Dashboard'} ? 'active' : ''">Dashboard</a>
    <a th:href="@{/patients}" th:classappend="${title=='Patients'} ? 'active' : ''">Patients</a>
    <a th:href="@{/doctors}" th:classappend="${title=='Doctors'} ? 'active' : ''">Doctors</a>
    <a th:href="@{/appointments}" th:classappend="${title=='Appointments'} ? 'active' : ''">Appointments</a>
</div>

<div class="main">

    <div class="topbar">
        <h1 th:text="${title}">Page</h1>
        <div th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy HH:mm')}"></div>
    </div>

    <!-- PAGE CONTENT LOADS HERE -->
    <div th:replace="${content}"></div>

</div>

</body>
</html>
