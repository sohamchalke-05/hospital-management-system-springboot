<div th:fragment="content">

    <div class="topbar">
        <h1>Hospital Dashboard</h1>
        <div id="clock"></div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Patients</h3>
            <div class="number" th:text="${totalPatients}">0</div>
        </div>

        <div class="card">
            <h3>Total Doctors</h3>
            <div class="number" th:text="${totalDoctors}">0</div>
        </div>

        <div class="card">
            <h3>Appointments Today</h3>
            <div class="number" th:text="${appointmentsToday}">0</div>
        </div>

        <div class="card">
            <h3>Available Beds</h3>
            <div class="number" th:text="${availableBeds}">0</div>
        </div>
    </div>

    <div class="charts">

        <div class="chart-container">
            <canvas id="appointmentsChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="bedsChart"></canvas>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function updateClock(){
            document.getElementById("clock").innerText =
                new Date().toLocaleString();
        }
        setInterval(updateClock,1000);
        updateClock();

        new Chart(document.getElementById('appointmentsChart'), {
            type: 'bar',
            data: {
                labels: ['Jan','Feb','Mar','Apr','May','Jun'],
                datasets: [{
                    label: 'Appointments',
                    data: [12,19,8,15,22,18],
                    backgroundColor: '#4da6ff'
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false
            }
        });

        new Chart(document.getElementById('bedsChart'), {
            type: 'doughnut',
            data: {
                labels: ['Occupied','Available'],
                datasets: [{
                    data: [38,12],
                    backgroundColor: ['#ff4d4d','#28a745']
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false
            }
        });
    </script>

</div>
