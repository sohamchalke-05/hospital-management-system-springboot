<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

        body {
            display: flex;
            background: #0f2027;
            color: white;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, #141e30, #243b55);
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Main */
        .main {
            flex: 1;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 { font-weight: 400; }
        .card .number { font-size: 30px; font-weight: 700; margin-top:10px; }

        /* Charts Section */
        .charts {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .chart-container {
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 12px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Responsive */
        @media(max-width: 900px){
            .charts{
                grid-template-columns: 1fr;
            }
            .sidebar{
                display:none;
            }
            body{
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

<div class="sidebar">
    <h2>🏥 HMS</h2>
    <a href="#">Dashboard</a>
    <a href="#">Patients</a>
    <a href="#">Doctors</a>
    <a href="#">Appointments</a>
    <a href="#">Reports</a>
</div>

<div class="main">

    <div class="topbar">
        <h1>Hospital Dashboard</h1>
        <div id="clock"></div>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Total Patients</h3>
            <div class="number" th:text="${totalPatients}">0</div>
        </div>

        <div class="card">
            <h3>Total Doctors</h3>
            <div class="number" th:text="${totalDoctors}">0</div>
        </div>

        <div class="card">
            <h3>Appointments Today</h3>
            <div class="number" th:text="${appointmentsToday}">0</div>
        </div>

        <div class="card">
            <h3>Available Beds</h3>
            <div class="number" th:text="${availableBeds}">0</div>
        </div>
    </div>

    <div class="charts">

        <div class="chart-container">
            <canvas id="appointmentsChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="bedsChart"></canvas>
        </div>

    </div>

</div>

<script>
    function updateClock(){
        document.getElementById("clock").innerText =
            new Date().toLocaleString();
    }
    setInterval(updateClock,1000);
    updateClock();

    new Chart(document.getElementById('appointmentsChart'), {
        type: 'bar',
        data: {
            labels: ['Jan','Feb','Mar','Apr','May','Jun'],
            datasets: [{
                label: 'Appointments',
                data: [12,19,8,15,22,18],
                backgroundColor: '#4da6ff'
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });

    new Chart(document.getElementById('bedsChart'), {
        type: 'doughnut',
        data: {
            labels: ['Occupied','Available'],
            datasets: [{
                data: [38,12],
                backgroundColor: ['#ff4d4d','#28a745']
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
</script>

</body>
</html>
